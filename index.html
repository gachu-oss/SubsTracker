<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubsTracker - Subscription Manager</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <h1> SubsTracker</h1>
    <div id="userArea" class="hidden">
      <span id="userEmail"></span>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="container">

    <!-- Auth Box (Modern Spacious Card) -->
    <div id="authBox" class="auth-card">
      <div class="auth-header">
        <h2 id="authTitle">Welcome Back</h2>
        <p id="authSubtitle" class="auth-desc">Sign in to manage and monitor your daily recurring subscriptions</p>
      </div>

      <p id="authMsg" class="message hidden"></p>

      <form id="authForm" class="auth-form">
        <div class="input-field">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="name@example.com" required>
        </div>

        <div class="input-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password (6+ chars)" minlength="6" required>
        </div>

        <button type="submit" id="authBtn" class="btn-primary-large">Sign In</button>

        <div class="auth-footer-toggle">
          <span id="authToggleHint">Don't have an account yet?</span>
          <button type="button" id="toggleAuth" class="link-action-btn">Create one now</button>
        </div>
      </form>
    </div>

    <!-- Dashboard (Subscriptions) -->
    <div id="dashboard" class="hidden">

      <!-- Total Spend & Live Currency Selector -->
      <div class="summary-box">
        <div>
          <h2>Total Monthly Spend</h2>
          <span class="summary-subtext">Live rates via ExchangeRate-API</span>
        </div>

        <div class="summary-right">
          <p id="totalSpend">$0.00</p>
          <select id="currencySelector" class="currency-select" title="Switch Currency">
            <option value="USD">USD ($)</option>
            <option value="KES">KES (KSh)</option>
            <option value="EUR">EUR (€)</option>
            <option value="GBP">GBP (£)</option>
          </select>
        </div>
      </div>

      <!-- Dashboard 2-Column Grid Layout -->
      <div class="dashboard-grid">

        <!-- Left Column: Add Subscription & Your Subscriptions (Bigger) -->
        <div class="dashboard-left">

          <!-- Add/Edit Subscription Form -->
          <div class="card">
            <h2 id="formTitle">Add Subscription</h2>

            <form id="subForm">
              <input type="hidden" id="subId">

              <div class="form-row">
                <div class="form-col">
                  <label for="subName">Service Name</label>
                  <input type="text" id="subName" placeholder="e.g. Netflix" required>
                </div>
                <div class="form-col">
                  <label for="subCost">Monthly Cost ($)</label>
                  <input type="number" id="subCost" placeholder="9.99" step="0.01" min="0.01" required>
                </div>
              </div>

              <div class="form-row">
                <div class="form-col">
                  <label for="subCategory">Category</label>
                  <select id="subCategory">
                    <option value="Entertainment">Entertainment</option>
                    <option value="Music">Music</option>
                    <option value="Fitness">Fitness</option>
                    <option value="Cloud & Tools">Cloud & Tools</option>
                  </select>
                </div>
                <div class="form-col">
                  <label for="subRenewal">Renewal Date</label>
                  <input type="date" id="subRenewal" required>
                </div>
              </div>

              <div class="form-row form-row-bottom">
                <div class="form-col">
                  <label for="subStatus">Status</label>
                  <select id="subStatus">
                    <option value="Active">Active</option>
                    <option value="Paused">Paused</option>
                    <option value="Canceled">Canceled</option>
                  </select>
                </div>
                <div class="form-col form-actions">
                  <button type="submit" id="saveBtn">Save Subscription</button>
                  <button type="button" id="cancelBtn" class="secondary-btn hidden">Cancel</button>
                </div>
              </div>
            </form>
          </div>

          <!-- Subscription List -->
          <div class="card sub-list-card">
            <div class="list-header">
              <h2>Your Subscriptions</h2>
              <select id="filterStatus">
                <option value="all">All</option>
                <option value="Active">Active</option>
                <option value="Paused">Paused</option>
                <option value="Canceled">Canceled</option>
              </select>
            </div>

            <ul id="subList"></ul>
          </div>

        </div>

        <!-- Right Column: Renewal Calendar -->
        <div class="dashboard-right">
          <!-- Renewal Calendar Card -->
          <div class="card calendar-card">
            <div class="calendar-header">
              <div class="cal-nav-group">
                <button type="button" id="prevMonthBtn" class="cal-nav-btn" title="Previous Month">‹</button>
                <h2 id="calMonthTitle">Renewal Calendar</h2>
                <button type="button" id="nextMonthBtn" class="cal-nav-btn" title="Next Month">›</button>
              </div>
            </div>

            <!-- 7 Days of the week -->
            <div class="calendar-grid-header">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>

            <!-- Days 1 to 31 injected by JS -->
            <div id="calendarDays" class="calendar-grid"></div>

            <!-- Month Renewals & Day Details -->
            <div id="calDetails" class="cal-details-box"></div>

            <!-- Next Due Notice -->
            <div id="nextDueNotice" class="next-due-box">No active subscriptions.</div>
          </div>
        </div>

      </div>

    </div>

  </main>

  <script type="module" src="js/main.js"></script>
</body>

</html>

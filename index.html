<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubsTacker - Subscription Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
    <h1> SubsTracker</h1>
    <div id="userArea" class="hidden">
      <span id="userEmail"></span>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="container">
    <!-- Auth Box (Modern Spacious Card) -->
    <div id="authBox" class="auth-card">
      <div class="auth-header">
        <h2 id="authTitle">Welcome Back</h2>
        <p id="authSubtitle" class="auth-desc">Sign in to manage and monitor your daily recurring subscriptions</p>
      </div>

      <p id="authMsg" class="message hidden"></p>

      <form id="authForm" class="auth-form">
        <div class="input-field">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="name@example.com" required>
        </div>

        <div class="input-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password (6+ chars)" minlength="6" required>
        </div>

        <button type="submit" id="authBtn" class="btn-primary-large">Sign In</button>

        <div class="auth-footer-toggle">
          <span id="authToggleHint">Don't have an account yet?</span>
          <button type="button" id="toggleAuth" class="link-action-btn">Create one now</button>
        </div>
      </form>
    </div>
     <!-- Add/Edit Subscription Form -->
      <div class="card">
        <h2 id="formTitle">Add Subscription</h2>

        <form id="subForm">
          <input type="hidden" id="subId">

          <label>Service Name</label>
          <input type="text" id="subName" placeholder="e.g. Netflix" required>

          <label>Monthly Cost ($)</label>
          <input type="number" id="subCost" placeholder="9.99" step="0.01" min="0.01" required>

          <label>Category</label>
          <select id="subCategory">
            <option value="Entertainment">Entertainment</option>
            <option value="Music">Music</option>
            <option value="Fitness">Fitness</option>
            <option value="Cloud & Tools">Cloud & Tools</option>
          </select>

          <label>Renewal Date</label>
          <input type="date" id="subRenewal" required>

          <label>Status</label>
          <select id="subStatus">
            <option value="Active">Active</option>
            <option value="Paused">Paused</option>
            <option value="Canceled">Canceled</option>
          </select>

          <button type="submit" id="saveBtn">Save Subscription</button>
          <button type="button" id="cancelBtn" class="secondary-btn hidden">Cancel</button>
        </form>
      </div>

      <!-- Subscription List -->
      <div class="card">
        <div class="list-header">
          <h2>Your Subscriptions</h2>
          <select id="filterStatus">
            <option value="all">All</option>
            <option value="Active">Active</option>
            <option value="Paused">Paused</option>
            <option value="Canceled">Canceled</option>
          </select>
        </div>

        <ul id="subList"></ul>
      </div>

    </div>

  </main>


    
</body>
</html>
